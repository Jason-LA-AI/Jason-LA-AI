<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        {% block title %}
        Jason | Los Angeles Private Transportation
        {% endblock %}
    </title>


    <meta name="description"
          content="{% block description %}
          Jason provides Los Angeles private transportation,
          airport pickup, Disneyland transportation and long distance rides.
          {% endblock %}">


    <meta name="keywords"
          content="
          Los Angeles airport transportation,
          Chinese private driver Los Angeles,
          LAX airport pickup,
          Ontario Airport transportation,
          Disneyland transportation
          ">
    <link rel="canonical" href="{{ site_url }}{{ request.url.path }}">
    <meta property="og:title" content="{% block og_title %}Jason Transportation | Los Angeles Private Driver{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Private airport transportation in Los Angeles, including LAX, Ontario Airport, Disneyland and San Diego rides.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="{{ site_url }}{{ request.url.path }}">
    <meta property="og:image" content="{{ site_url }}/static/images/service/01-airport-pickup.webp">


    <link rel="stylesheet" href="/static/home.css?v=20260805-6">
    {% block extra_css %}{% endblock %}
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script type="application/ld+json">

{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "Jason Transportation",
  "description": "Los Angeles private transportation service including airport pickup, Disneyland transportation and long distance rides.",
  "areaServed": [
    "Los Angeles County",
    "Orange County",
    "San Diego County"
  ],
  "serviceType": [
    "Airport Transportation",
    "Private Driver Service",
    "Disneyland Transportation",
    "Long Distance Transportation"
  ],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Los Angeles",
    "addressRegion": "CA",
    "addressCountry": "US"
  }
}

</script>

</head>



<body>


{% include "nav.html" %}



{% block content %}

{% endblock %}

{% block extra_js %}{% endblock %}


<footer>

<p>
Jason Transportation
</p>

</footer>



</body>

</html>
